[package]
name = "evocc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Equality-native, self-contained C compiler (flight-lab scaffold)"
default-run = "evocc"

[[bin]]
name = "evocc-checker"
path = "src/bin/evocc-checker.rs"

[dependencies]
evocc-common = { path = "../evocc-common" }
evocc-chir = { path = "../evocc-chir" }
evocc-lex = { path = "../evocc-lex" }
evocc-cpp = { path = "../evocc-cpp" }
evocc-eqopt = { path = "../evocc-eqopt" }
evocc-proof = { path = "../evocc-proof" }
evocc-proofcheck = { path = "../evocc-proofcheck" }
evocc-evoir = { path = "../evocc-evoir" }
evocc-parser = { path = "../evocc-parser" }
evocc-lower = { path = "../evocc-lower" }
evocc-mir = { path = "../evocc-mir" }
evocc-types = { path = "../evocc-types" }
