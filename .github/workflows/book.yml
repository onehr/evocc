# Book: build book/ with a pinned mdBook release. Deploy it to GitHub Pages on
# a push to main. Pull requests only build it.
name: Book

on:
  push:
    branches: [main]
    paths: ["book/**", "crates/evocc/explain/**", "tools/gen-error-index.py",
            "tests/contracts/ladder-*-receipt.json", "tools/gen-compat-matrix.py",
            "tools/bench.py", ".github/workflows/book.yml"]
  pull_request:
    paths: ["book/**", "crates/evocc/explain/**", "tools/gen-error-index.py",
            "tests/contracts/ladder-*-receipt.json", "tools/gen-compat-matrix.py",
            "tools/bench.py", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.4.52
  # The SHA-256 that the mdBook v0.4.52 release lists for the x86_64 Linux archive.
  MDBOOK_SHA256: c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          archive="mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/$archive"
          (cd "$RUNNER_TEMP" && sha256sum "$archive" &&
            if [ -n "$MDBOOK_SHA256" ]; then echo "$MDBOOK_SHA256  $archive" | sha256sum -c; fi)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: |
          python3 tools/gen-error-index.py
          python3 tools/gen-compat-matrix.py
          mdbook --version
          mdbook build book --dest-dir "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
