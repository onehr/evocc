# One rolling prerelease, built from the same main commit on both hosts.
name: Nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
