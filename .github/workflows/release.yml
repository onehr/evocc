# Stable tags and the rolling nightly reuse the same build and smoke checks.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target/frontend
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}

jobs:
  headers:
    if: inputs.channel != 'nightly' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Export sealed Linux headers
        run: |
          docker build --platform linux/arm64 -t evo-flight-lab:sealed -f .toolchain/Dockerfile.flight-lab .toolchain
          tools/export-sysroot.sh
          tar -czf linux-headers.tar.gz sysroot contracts/sysroot-aarch64-unknown-linux-gnu.json
      - uses: actions/upload-artifact@v4
        with: {name: linux-headers, path: linux-headers.tar.gz, if-no-files-found: error}
  build:
    needs: headers
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {name: linux-headers}
      - run: tar -xzf linux-headers.tar.gz
      # On Linux, tools/release.sh links evocc statically against musl.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install || rustup show
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
            rustup target add aarch64-unknown-linux-musl
          fi
          cargo fetch --locked
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # A clean build without caches: Cargo builds evocc, Lake builds evoir-sem.
      - name: Build and package
        run: tools/release.sh --target "$TARGET" --out dist --with-lean
      - name: Resolve the archive and check the stable version
        run: |
          case "$RELEASE_CHANNEL" in
            stable)
              echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
              package="evocc-${GITHUB_REF_NAME#v}-$TARGET"
              ;;
            nightly)
              test "$GITHUB_REF" = refs/heads/main
              set -- dist/evocc-*-$TARGET.tar.gz
              test "$#" -eq 1 && test -f "$1"
              package="${1#dist/}"; package="${package%.tar.gz}"
              ;;
            *) echo "::error::unsupported release channel"; exit 1 ;;
          esac
          test -f "dist/$package.tar.gz" || { echo "::error::archive version disagrees with the tag"; ls dist; exit 1; }
          echo "PACKAGE_NAME=$package" >> "$GITHUB_ENV"
      - name: Smoke test the archive
        run: |
          mkdir smoke
          tar -xzf "dist/$PACKAGE_NAME.tar.gz" -C smoke
          cd "smoke/$PACKAGE_NAME"
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          ./bin/evocc --version
          if [ "$TARGET" = aarch64-apple-darwin ]; then
            printf '#include <stdio.h>\nint main(void) { puts("hello from EvoCC on Linux"); return 0; }\n' > cross.c
            ./bin/evocc --target=aarch64-unknown-linux-gnu --assembler='clang --target=aarch64-linux-gnu' -c cross.c -o "$GITHUB_WORKSPACE/cross-hello.o"
          fi
          cat > hello.c <<'C'
          static const char greeting[] = "hello, world";
          int main(void) { int n = 0; while (greeting[n] != '\0') n++; return n; }
          C
          out="$(./bin/evocc --interpret-c-hir hello.c)"
          echo "interpret-c-hir: $out"
          test "$out" = 12
          ./bin/evoir-sem --selftest > /dev/null
          file bin/evocc bin/evocc-checker bin/evoir-sem
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
            file bin/evocc bin/evocc-checker | grep -Eq 'static(-pie)? linked|statically linked'
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with: {name: cross-hello, path: cross-hello.o, if-no-files-found: error}
      - name: Give nightly assets stable download names
        if: inputs.channel == 'nightly'
        run: mv "dist/$PACKAGE_NAME.tar.gz" "dist/evocc-nightly-$TARGET.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: evocc-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: cross-hello}
      - name: Link and run the macOS-produced object
        run: |
          gcc cross-hello.o -o cross-hello
          test "$(./cross-hello)" = 'hello from EvoCC on Linux'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: evocc-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum evocc-*.tar.gz | tee SHA256SUMS
      - name: Create the release
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "EvoCC $GITHUB_REF_NAME"
      - name: Replace the rolling nightly assets
        if: env.RELEASE_CHANNEL == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -f dist/evocc-nightly-aarch64-apple-darwin.tar.gz
          test -f dist/evocc-nightly-aarch64-unknown-linux-gnu.tar.gz
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
          fi
          notes="Built from main commit $GITHUB_SHA. Replaces the previous nightly; not a stable release."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/*.tar.gz dist/SHA256SUMS --clobber
            gh release edit nightly --prerelease --latest=false --title "EvoCC nightly" --notes "$notes"
          else
            gh release create nightly dist/*.tar.gz dist/SHA256SUMS --verify-tag \
              --prerelease --latest=false --title "EvoCC nightly" --notes "$notes"
          fi
