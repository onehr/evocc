# EvoCC workspace.
#
# Day-1 scope: the workspace exists so that the flight lab's
# compiler_capabilities_are_red gate has a real binary to interrogate. Every
# capability must fail closed with an explicit NOT_IMPLEMENTED verdict; the
# gate treats silent success, delegation to another compiler, or an unknown
# failure mode as a contract violation.
#
# Day-2 scope: the semantic universe foundation. Eight crates define the
# compiler's narrow waist: span/diagnostic infrastructure, the type system
# (C and EvoIR), lexer, preprocessor, both IRs, the e-graph core, and proof
# justifications. The evocc binary remains a RED capability probe shell.

[workspace]
resolver = "2"
members = [
    "crates/evocc",
    "crates/evocc-common",
    "crates/evocc-types",
    "crates/evocc-memory",
    "crates/evocc-mir",
    "crates/evocc-lex",
    "crates/evocc-cpp",
    "crates/evocc-chir",
    "crates/evocc-evoir",
    "crates/evocc-eqopt",
    "crates/evocc-egraph",
    "crates/evocc-proof",
    "crates/evocc-proofcheck",
    "crates/evocc-randgate",
    "crates/evocc-parser",
    "crates/evocc-lower",
    "crates/evocc-policy",
    "crates/evocc-passes",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
# Reproducible and auditable beats clever for a flight lab: keep debug info
# for crash forensics and disable nothing that changes semantics.
debug = true
lto = false
