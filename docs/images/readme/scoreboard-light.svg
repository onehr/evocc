<text x="20.5" y="102.5" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">boots under HVF and under TCG</text>
<text x="20.5" y="120.5" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">125/125 selected selftests pass</text>
<rect x="292.5" y="0.5" width="275" height="135" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="312.5" y="50.5" fill="#1a7f37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700">0</text>
<text x="312.5" y="78.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">SQLite test errors</text>
<text x="312.5" y="102.5" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">in 329,803 tests of its</text>
<text x="312.5" y="120.5" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">veryquick suite</text>
