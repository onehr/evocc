<svg xmlns="http://www.w3.org/2000/svg" width="860" height="769" viewBox="0 0 860 769" role="img" aria-label="One line of C at four stages of EvoCC">
<text x="0" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">C source</text>
<text x="0" y="44" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">mean.c, line 7</text>
<rect x="172.5" y="2.5" width="687" height="36" rx="10" fill="#0d1117" stroke="#3d444d"/>
<text x="186" y="24" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">s-&gt;count += 1;</text>
<path d="M516 51 V69" stroke="#656c76" stroke-width="2"/><path d="M516 77 l-6 -10 h12 z" fill="#656c76"/>
<text x="0" y="109" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">C-HIR</text>
<text x="0" y="131" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">typed C</text>
<rect x="172.5" y="89.5" width="687" height="93" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="186" y="114" fill="#f0f6fc" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">s-&gt;count</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14"> is an int of 4 bytes</tspan></text>
<rect x="178" y="123" width="676" height="24" rx="4" fill="#3d2e00" stroke="#9e6a03"/>
<text x="186" y="140" fill="#f0f6fc" xml:space="preserve" font-weight="600"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">its bytes are not initialized</tspan></text>
<text x="186" y="166" fill="#f0f6fc" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">s</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14"> points into the struct stats object of mean()</tspan></text>
<text x="172" y="205" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">evo check stops here: E3001 read-of-uninitialized-object at mean.c:7:9</text>
<path d="M516 217 V235" stroke="#656c76" stroke-width="2"/><path d="M516 243 l-6 -10 h12 z" fill="#656c76"/>
<text x="0" y="275" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">EvoIR</text>
<text x="0" y="297" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">typed SSA</text>
<rect x="172.5" y="255.5" width="687" height="204" rx="10" fill="#0d1117" stroke="#3d444d"/>
<text x="186" y="277" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">^b3(…, %v32: ptr&lt;generic&gt;, …, %v34: mem&lt;all&gt;, %v35: world):</text>
<text x="186" y="298" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    %v36 = const.bits&lt;32&gt; 1</text>
<text x="186" y="319" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    %v37 = access_in_bounds %v34, %v32 [size=4, align=4]</text>
<text x="186" y="340" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    (%v38, %v39, %v40) = load %v37, %v35, %v32 : bits&lt;32&gt;</text>
<rect x="178" y="347" width="676" height="19" rx="4" fill="#3d2e00" stroke="#9e6a03"/>
<text x="186" y="361" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" font-weight="700">    %v41 = signed_add_defined %v38, %v36</text>
<rect x="178" y="368" width="676" height="19" rx="4" fill="#3d2e00" stroke="#9e6a03"/>
<text x="186" y="382" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" font-weight="700">    ub.assume.signed_overflow %v41</text>
<text x="186" y="403" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    %v42 = add.bits&lt;32&gt; %v38, %v36</text>
<text x="186" y="424" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    %v43 = access_in_bounds %v39, %v32 [size=4, align=4]</text>
<text x="186" y="445" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    (%v44, %v45) = store %v43, %v40, %v32, %v42</text>
<text x="172" y="482" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Each rule of C is a predicate and an obligation that no pass may delete.</text>
<text x="172" y="504" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Lean proves the rewrite rules on bits&lt;N&gt; values, for every N.</text>
<path d="M516 516 V534" stroke="#656c76" stroke-width="2"/><path d="M516 542 l-6 -10 h12 z" fill="#656c76"/>
<text x="0" y="574" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">AArch64</text>
<text x="0" y="596" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">bits only</text>
<rect x="172.5" y="554.5" width="687" height="162" rx="10" fill="#0d1117" stroke="#3d444d"/>
<text x="186" y="576" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">.Lmean_block3:</text>
<text x="186" y="597" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    movz w5, #1</text>
<text x="186" y="618" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    ldr w6, [x2, #0]</text>
<rect x="178" y="625" width="676" height="19" rx="4" fill="#3d2e00" stroke="#9e6a03"/>
<text x="186" y="639" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" font-weight="700">    adds w5, w6, w5</text>
<rect x="178" y="646" width="676" height="19" rx="4" fill="#3d2e00" stroke="#9e6a03"/>
<text x="186" y="660" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" font-weight="700">    b.vs .Lmean_block18</text>
<text x="186" y="681" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">.Lmean_block12:</text>
<text x="186" y="702" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    str w5, [x2, #0]</text>
<text x="172" y="739" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Only bits remain: no type, no init state, no pointer object.</text>
<text x="172" y="761" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">The overflow rule stays a trap: b.vs leads to brk #3004.</text>
</svg>
