<image href="data:image/png;base64," x="43" y="144" width="136" height="61"/>
<text x="45" y="218" font-family="sans-serif" font-size="11" fill="#17293c">IMG_0042.ppm</text>
</g>
<g transform="rotate(-3 278 181)">
