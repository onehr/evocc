<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<title>Toybox / tidy a photo folder: Same pictures, different filenames. Find the duplicates.</title>
<rect width="800" height="500" rx="16" fill="#0b1424"/>
<text x="28" y="42" font-family="sans-serif" font-size="30" fill="#f3f7ff">Toybox / tidy a photo folder</text>
<text x="28" y="73" font-family="sans-serif" font-size="18" fill="#97b9da">Same pictures, different filenames. Find the duplicates.</text>
<text x="28" y="476" font-family="sans-serif" font-size="15" fill="#97aac1">Procedural postcards / actual sha256sum, sort, uniq, mkdir, cp / originals kept</text>
<text x="38" y="119" font-family="sans-serif" font-size="19" fill="#f3bc7c">MESSY DOWNLOADS</text>
<text x="540" y="119" font-family="sans-serif" font-size="19" fill="#66dec4">CLEAN ALBUM</text>
