<text x="28" y="73" font-family="sans-serif" font-size="18" fill="#97b9da">Real ARM64 boot / 7,008 EvoCC target-C objects</text>
<text x="28" y="476" font-family="sans-serif" font-size="15" fill="#97aac1">Visualization + serial excerpt from recorded boot / not full kernel-test completion</text>
<rect x="38" y="125" width="156" height="70" rx="12" fill="#163549"/>
<text x="51" y="168" font-family="sans-serif" font-size="22" fill="#66dec4">KERNEL</text>
<text x="201" y="166" font-family="sans-serif" font-size="26" fill="#dce8f5">→</text>
<rect x="230" y="125" width="156" height="70" rx="12" fill="#163549"/>
<text x="243" y="168" font-family="sans-serif" font-size="22" fill="#66dec4">/init</text>
<text x="393" y="166" font-family="sans-serif" font-size="26" fill="#dce8f5">→</text>
<rect x="422" y="125" width="156" height="70" rx="12" fill="#163549"/>
<text x="435" y="168" font-family="sans-serif" font-size="22" fill="#66dec4">NONCE</text>
<text x="585" y="166" font-family="sans-serif" font-size="26" fill="#dce8f5">→</text>
<rect x="614" y="125" width="156" height="70" rx="12" fill="#163549"/>
<text x="627" y="168" font-family="sans-serif" font-size="22" fill="#66dec4">POWEROFF</text>
<text x="36" y="249" font-family="sans-serif" font-size="18" fill="#dce8f5">[    0.289201] Run /init as init process</text>
<text x="36" y="283" font-family="sans-serif" font-size="18" fill="#dce8f5">EVO_INIT_ALIVE</text>
<text x="36" y="317" font-family="sans-serif" font-size="18" fill="#dce8f5">EVO_BOOT_NONCE k1-20260928T110715Z-7dbe7cc4</text>
<text x="36" y="351" font-family="sans-serif" font-size="18" fill="#dce8f5">EVO_INIT_DONE</text>
<text x="36" y="385" font-family="sans-serif" font-size="18" fill="#dce8f5">[    0.291147] reboot: Power down</text>
