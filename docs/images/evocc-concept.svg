<text x="80" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3" text-anchor="start" opacity="1.0" letter-spacing="-1">EvoCC</text>
<text x="80" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#e6edf3" text-anchor="start" opacity="1.0" letter-spacing="0">a C compiler whose optimizer keeps every equivalent form</text>
<text x="82" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#8b98a5" text-anchor="start" opacity="1.0" letter-spacing="0">Written from scratch in Rust; no LLVM or GCC inside. The optimizer is an e-graph: a rewrite adds a form,</text>
<text x="82" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#8b98a5" text-anchor="start" opacity="1.0" letter-spacing="0">a checker verifies each union, and a cost model picks one at the end. Target: AArch64, Linux 6.18 kernel.</text>
<text x="330" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8b98a5" text-anchor="middle" opacity="1" letter-spacing="1">a pass-based compiler</text>
