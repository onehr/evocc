<text x="80" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f2f4f8" text-anchor="start" opacity="1.0" letter-spacing="-1">Every rewrite, proved.</text>
<text x="82" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#8f9bb3" text-anchor="start" opacity="1.0" letter-spacing="0">EvoCC is a C compiler that optimizes by remembering instead of rewriting.</text>
<text x="82" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#8f9bb3" text-anchor="start" opacity="1.0" letter-spacing="0">No LLVM. No GCC. Written from scratch, aimed at booting Linux.</text>
