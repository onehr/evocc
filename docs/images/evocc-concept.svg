<text x="60" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f3f6" text-anchor="start" opacity="1.0" letter-spacing="-1">EvoCC</text>
<text x="60" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#f0f3f6" text-anchor="start" opacity="1.0" letter-spacing="0">a C compiler whose optimizer keeps every equivalent form</text>
<text x="60" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9aa4b2" text-anchor="start" opacity="1.0" letter-spacing="0">Written from scratch in Rust, no LLVM or GCC inside. A rewrite adds a form, a separate checker</text>
<text x="60" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9aa4b2" text-anchor="start" opacity="1.0" letter-spacing="0">verifies each union, and a cost model picks one at the end. Target: AArch64, the Linux 6.18 kernel.</text>
<text x="220" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9aa4b2" text-anchor="middle" opacity="1" letter-spacing="1">a pass-based compiler</text>
