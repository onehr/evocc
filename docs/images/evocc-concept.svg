<text x="80" y="866" font-family="JetBrains Mono, Menlo, monospace" font-size="14" font-weight="normal" fill="#8f9bb3" text-anchor="start" opacity="1.0" letter-spacing="0">github.com/onehr/evocc</text>
<text x="1540" y="866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8f9bb3" text-anchor="end" opacity="1.0" letter-spacing="0">a 30-day experiment in letting a specification, two oracles and a proof checker govern an AI that writes a compiler</text>
